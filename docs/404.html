<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>404 — Valence View</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cellipse cx='16' cy='8.5' rx='5' ry='7' fill='%23ff6b6b'/%3E%3Cellipse cx='16' cy='23.5' rx='5' ry='7' fill='%234dabf7'/%3E%3Ccircle cx='16' cy='16' r='2.5' fill='%23e6e9ee'/%3E%3C/svg%3E">
<style>
/* Standalone page: token values copied by value from css/base.css so this
   file needs no external resources at all. */
:root {
  color-scheme: dark light;
  --bg: #0e1116;
  --bg-panel: #171b22;
  --text: #e6e9ee;
  --text-dim: #9aa3b2;
  --border: #2a313c;
  --accent: #4cc9f0;
  --pos-lobe: #ff6b6b;
  --neg-lobe: #4dabf7;
  --radius: 8px;
  --font: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f7f8fa;
    --bg-panel: #ffffff;
    --text: #1a2029;
    --text-dim: #5c6675;
    --border: #d5dae2;
    --accent: #0f7fa8;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  line-height: 1.6;
  padding: 24px;
}
main {
  max-width: 34rem;
  text-align: center;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 40px 32px 36px;
}
.orbital { display: block; margin: 0 auto 18px; }
h1 {
  font-size: 1.15rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-dim);
  margin: 0 0 10px;
}
h1 code {
  font-family: var(--mono);
  color: var(--text);
  letter-spacing: normal;
  text-transform: none;
}
p.msg { font-size: 1.2rem; margin: 0 0 22px; }
a.back {
  display: inline-block;
  color: var(--accent);
  border: 1px solid var(--accent);
  border-radius: 999px;
  padding: 9px 22px;
  text-decoration: none;
  font-weight: 600;
}
a.back:hover { background: var(--bg); }
a.back:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg class="orbital" width="96" height="96" viewBox="0 0 32 32" aria-hidden="true">
    <ellipse cx="16" cy="8.5" rx="5" ry="7" fill="var(--pos-lobe)" opacity="0.35"/>
    <ellipse cx="16" cy="23.5" rx="5" ry="7" fill="var(--neg-lobe)" opacity="0.35"/>
    <circle cx="16" cy="16" r="2.5" fill="var(--text-dim)"/>
    <line x1="4" y1="4" x2="28" y2="28" stroke="var(--text-dim)" stroke-width="1.5" stroke-linecap="round"/>
  </svg>
  <h1>404 · <code>|ψ|² = 0</code></h1>
  <p class="msg">This orbital does not exist — its wavefunction has zero amplitude here.</p>
  <a class="back" id="back-link" href="index.html">Return to a bound state</a>
</main>
<script>
/* GitHub Pages serves this file for ANY missing path, so a relative link
   breaks for nested URLs. Resolve the site root: '/<repo>/' on project
   pages, '/' otherwise. The static href stays as the no-JS fallback. */
(function () {
  if (location.protocol === 'file:') return;
  var parts = location.pathname.split('/').filter(Boolean);
  var root = (/\.github\.io$/i.test(location.hostname) && parts.length > 1)
    ? '/' + parts[0] + '/' : '/';
  document.getElementById('back-link').href = root + 'index.html';
})();
</script>
</body>
</html>
